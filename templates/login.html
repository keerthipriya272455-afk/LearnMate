<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | LearnMate</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-logo">
            🎓
        </div>

        <h1>
            Welcome to <span>LearnMate</span>
        </h1>

        <p>
            Login to continue your learning journey.
        </p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <div id="loginError"></div>

            <button type="submit">
                Login →
            </button>

        </form>

        <p class="auth-switch">

            Don't have an account?

            <a href="{{ url_for('signup') }}">
                Sign Up
            </a>

        </p>

    </div>

</div>


<script>

document.getElementById("loginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorBox =
        document.getElementById("loginError");

    errorBox.textContent = "";

    try {

        const response = await fetch(
            "/login",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            errorBox.textContent =
                data.error || "Login failed.";

            return;
        }

        window.location.href = "/";

    } catch (error) {

        errorBox.textContent =
            "Unable to connect to StudyAI.";

    }

});

</script>

</body>
</html>
